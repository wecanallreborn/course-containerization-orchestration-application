services:
  db:
    image: postgres:15
    container_name: manuk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - manuk-pgdata:/var/lib/postgresql/data
    networks:
      - manuk-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    build: .
    container_name: manuk-assistant
    ports:
      - "${APP_PORT}:8025"  
    environment:
      APP_OWNER: ${APP_OWNER}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CACHE_TTL: ${CACHE_TTL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - manuk-backend

  redis:
    image: redis:7-alpine
    container_name: manuk-redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - manuk-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  manuk-pgdata:

networks:
  manuk-backend:
    driver: bridge